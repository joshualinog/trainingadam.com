name: Site change
description: Request a change to the trainingadam.com website
title: "Site change: "
body:
  - type: dropdown
    id: change-type
    attributes:
      label: Change type
      description: Choose the category label that best fits this request.
      options:
        - Enhancement
        - Feature
        - Content creation
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or area
      description: Which page or part of the website should be changed?
      placeholder: "https://trainingadam.com/"
    validations:
      required: true

  - type: textarea
    id: requested-change
    attributes:
      label: Requested change
      description: Describe what you would like changed.
      placeholder: Explain the change you have in mind.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What problem would this change solve, or what would it improve?
    validations:
      required: true

  - type: checkboxes
    id: style-areas
    attributes:
      label: Potential style changes (optional)
      description: Check any styling areas this change involves.
      options:
        - label: Color style guide
        - label: Typography / fonts
        - label: Illustration components
        - label: Icons
        - label: Layout / spacing
        - label: Buttons / organic shapes
        - label: Images / backgrounds
        - label: Animation / interaction
        - label: Mobile / responsive design

  - type: textarea
    id: style-details
    attributes:
      label: Style details (optional)
      description: Describe the CSS or styling you have in mind, such as colors, fonts, or reference examples.
    validations:
      required: false

  - type: textarea
    id: added-features
    attributes:
      label: Added or potential features (optional)
      description: List features you want on this change, such as a contact form, a link, an embed, or a sign-up.
      placeholder: "- Contact form\n- Link to partner website"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Expected outcome
      description: How will we know the change is complete?
    validations:
      required: false
